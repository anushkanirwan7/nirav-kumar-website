<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Nirav Kumar</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header>
    <nav class="navbar">

        <div class="logo">
            <h2>Nirav Kumar</h2>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

    </nav>
</header>

<section class="section contact-page">
  <h1 class="section-title">Contact Me</h1>

  <div class="contact-container">

    <form id="contactForm">
      <input type="text" id="name" placeholder="Full Name">
      <small class="error"></small>

      <input type="email" id="email" placeholder="Email">
      <small class="error"></small>

      <input type="text" id="phone" placeholder="Phone Number">
      <small class="error"></small>

      <select id="service">
        <option value="">Select Service</option>
        <option>Website Development</option>
        <option>Landing Page</option>
      </select>

      <input type="text" placeholder="Budget">

      <textarea id="details" rows="5" placeholder="Project Details"></textarea>
      <small class="error"></small>

      <button type="submit" class="btn">Submit</button>

      <p id="successMessage"></p>
    </form>

    <div class="contact-info">
      <h3>Contact Details</h3>
      <p>Email: nirav@example.com</p>
      <p>Phone: +91 9876543210</p>
      <p>Location: Bhopal, Madhya Pradesh</p>

      <iframe
  src="https://www.google.com/maps?q=Bhopal,Madhya%20Pradesh&output=embed"
  width="100%"
  height="250"
  style="border:0; border-radius:10px;"
  allowfullscreen=""
  loading="lazy"
  referrerpolicy="no-referrer-when-downgrade">
</iframe>
    </div>

  </div>
</section>

<a href="https://wa.me/919876543210" class="whatsapp-btn">
  <i class="fab fa-whatsapp"></i>
</a>

<script src="js/validation.js"></script>
<script src="js/main.js"></script>
</body>
</html>
